<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a16" media="(prefers-color-scheme: dark)">
<title>الأذكار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7;
    --card: #fffdf8;
    --ink: #2a251d;
    --muted: #7d7462;
    --accent: #b5542a;
    --line: #e4dccb;
    --shadow: 0 10px 30px rgba(60, 40, 10, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a16;
      --card: #26231e;
      --ink: #efe7d6;
      --muted: #a89e88;
      --accent: #e08a5c;
      --line: #3a352c;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: calc(.75rem + env(safe-area-inset-top)) 1.25rem .5rem;
  }
  #listToggle {
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    text-align: start;
    padding: 0;
    cursor: pointer;
    line-height: 1.3;
  }
  #listToggle .ar { font-size: 1.5rem; font-weight: 700; display: block; }
  #listToggle .en { font-size: .85rem; color: var(--muted); display: block; letter-spacing: .04em; }
  #counter {
    font-size: 1rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  #track {
    flex: 1 1 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  #track::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow-y: auto;
    padding: .5rem 1.25rem 1.25rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    box-shadow: var(--shadow);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1.5rem 1.25rem;
  }
  .card .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    color: var(--muted);
    font-size: .95rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }
  .card .meta .lang { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
  .card .body {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding: 1.25rem 0;
  }
  .card .text { width: 100%; margin: 0; }
  .card .title { color: var(--accent); margin: 0 0 .75rem; font-size: 1.15rem; font-weight: 700; }
  .page.arabic .text {
    font-size: clamp(1.7rem, 4.8vw, 2.4rem);
    line-height: 2.1;
    text-align: right;
  }
  .page.english .text {
    font-size: clamp(1.2rem, 3.2vw, 1.55rem);
    line-height: 1.65;
    text-align: left;
    font-style: italic;
  }
  .page.english .card { direction: ltr; }
  .card .text p { margin: 0 0 1em; }
  .card .text p:last-child { margin-bottom: 0; }
  .card .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding-top: .75rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 1rem;
  }
  .repeat {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: .1rem .75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  footer {
    flex: 0 0 auto;
    padding: 0 1.25rem calc(.75rem + env(safe-area-inset-bottom));
  }
  #progress {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .25s ease;
  }

  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow);
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .9;
  }
  .nav:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
  .nav:disabled { opacity: .25; cursor: default; }
  #nextBtn { left: .5rem; }
  #prevBtn { right: .5rem; }
  @media (pointer: coarse) { .nav { display: none; } }
</style>
</head>
<body>

<header>
  <button id="listToggle" type="button" title="Switch between morning and evening" aria-live="polite">
    <span class="ar"></span>
    <span class="en"></span>
  </button>
  <div id="counter" aria-live="polite"></div>
</header>

<main id="track" aria-label="Adhkār pages"></main>

<footer>
  <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>
</footer>

<button class="nav" id="prevBtn" type="button" aria-label="Previous page">&#x276F;</button>
<button class="nav" id="nextBtn" type="button" aria-label="Next page">&#x276E;</button>

<script>
/* ---------- Data: pages 4–7 of the Morning & Evening Adhkār leaflet ---------- */
/* when: "both" | "morning" | "evening".  A dhikr numbered 8–14 has a morning and an evening wording. */
const DHIKR = [
  {
    n: 1, when: "both", source: "Tabarānī", repeat: 1,
    title_ar: "آية الكرسي", title_en: "Āyat al-Kursī (2:255)",
    ar: ["اللهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَؤُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ."],
    en: ["Allah! There is no god but He, the Ever-Living, the Sustainer of all. Neither drowsiness nor sleep overtakes Him. To Him belongs whatever is in the heavens and whatever is on the earth. Who is there that can intercede with Him except by His permission? He knows what lies before them and what lies behind them, and they encompass nothing of His knowledge except what He wills. His Throne extends over the heavens and the earth, and preserving them does not tire Him. He is the Most High, the Most Great."]
  },
  {
    n: 2, when: "both", source: "Tirmidhī", repeat: 3,
    title_ar: "الإخلاص والفلق والناس", title_en: "Sūrahs al-Ikhlāṣ, al-Falaq and al-Nās",
    ar: [
      "بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيمِ. قُلْ هُوَ اللهُ أَحَدٌ ۝ اللهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ۝",
      "بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيمِ. قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝",
      "بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيمِ. قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ ۝"
    ],
    en: [
      "In the name of Allah, the Most Gracious, the Most Merciful. Say: He is Allah, the One. Allah, the Self-Sufficient. He neither begets nor was He begotten, and there is none comparable to Him.",
      "In the name of Allah, the Most Gracious, the Most Merciful. Say: I seek refuge in the Lord of the daybreak, from the evil of what He has created, from the evil of the darkness when it settles, from the evil of those who blow on knots, and from the evil of the envier when he envies.",
      "In the name of Allah, the Most Gracious, the Most Merciful. Say: I seek refuge in the Lord of mankind, the King of mankind, the God of mankind, from the evil of the whispering one who withdraws, who whispers into the hearts of mankind, from among the jinn and mankind."
    ]
  },
  {
    n: 3, when: "both", source: "Bukhārī", repeat: 1,
    title_ar: "سيد الاستغفار", title_en: "The master supplication for forgiveness",
    ar: ["اللَّهُمَّ أَنْتَ رَبِّيْ لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِيْ وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوْءُ بِذَنْبِيْ، فَاغْفِرْ لِيْ، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ."],
    en: ["O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep to Your covenant and Your promise as far as I am able. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins except You."]
  },
  {
    n: 4, when: "both", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوْذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوْذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوْذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ."],
    en: ["O Allah, I seek refuge in You from anxiety and grief. I seek refuge in You from weakness and laziness. I seek refuge in You from cowardice and miserliness. And I seek refuge in You from being overcome by debt and overpowered by men."]
  },
  {
    n: 5, when: "both", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ إِنِّيْ أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّيْ أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِيْ دِيْنِيْ وَدُنْيَايَ وَأَهْلِيْ وَمَالِيْ، اللَّهُمَّ اسْتُرْ عَوْرَاتِيْ وَآمِنْ رَوْعَاتِيْ، اللَّهُمَّ احْفَظْنِيْ مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِيْ، وَعَنْ يَمِيْنِيْ، وَعَنْ شِمَالِيْ، وَمِنْ فَوْقِيْ، وَأَعُوْذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِيْ."],
    en: ["O Allah, I ask You for well-being in this world and the next. O Allah, I ask You for pardon and well-being in my religion, my worldly life, my family and my wealth. O Allah, conceal my faults and calm my fears. O Allah, protect me from in front of me and from behind me, from my right and from my left, and from above me, and I seek refuge in Your greatness from being seized from beneath me."]
  },
  {
    n: 6, when: "both", source: "Tirmidhī", repeat: 1,
    ar: ["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيْكَهُ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ، أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَىٰ نَفْسِيْ سُوْءًا، أَوْ أَجُرَّهُ إِلَىٰ مُسْلِمٍ."],
    en: ["O Allah, Knower of the unseen and the seen, Creator of the heavens and the earth, Lord and Owner of all things, I bear witness that there is no god but You. I seek refuge in You from the evil of my own self, from the evil of Satan and his call to associate others with You, and from committing wrong against myself or bringing it upon a Muslim."]
  },
  {
    n: 7, when: "both", source: "Nasā’ī", repeat: 1,
    ar: ["يَا حَيُّ يَا قَيُّوْمُ، بِرَحْمَتِكَ أَسْتَغِيْثُ، أَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ، وَلَا تَكِلْنِيْ إِلَىٰ نَفْسِيْ طَرْفَةَ عَيْنٍ."],
    en: ["O Ever-Living, O Sustainer of all, by Your mercy I seek help. Set right all of my affairs, and do not leave me to myself even for the blink of an eye."]
  },

  {
    n: 8, when: "morning", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ مَا أَصْبَحَ بِيْ مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيْكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ."],
    en: ["O Allah, whatever blessing has come to me or to any of Your creation this morning is from You alone, without partner. So to You belongs all praise and to You belongs all thanks."]
  },
  {
    n: 8, when: "evening", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ مَا أَمْسَىٰ بِيْ مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيْكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ."],
    en: ["O Allah, whatever blessing has come to me or to any of Your creation this evening is from You alone, without partner. So to You belongs all praise and to You belongs all thanks."]
  },
  {
    n: 9, when: "morning", source: "Nasā’ī", repeat: 1,
    ar: ["أَصْبَحْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِيْنِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَىٰ مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِيْنَ."],
    en: ["We have entered the morning upon the natural way of Islam, upon the word of sincerity, upon the religion of our Prophet Muhammad ﷺ, and upon the way of our father Ibrāhīm, who was upright and a Muslim, and was not of those who associate others with Allah."]
  },
  {
    n: 9, when: "evening", source: "Nasā’ī", repeat: 1,
    ar: ["أَمْسَيْنَا عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِيْنِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَىٰ مِلَّةِ أَبِيْنَا إِبْرَاهِيْمَ حَنِيْفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِيْنَ."],
    en: ["We have entered the evening upon the natural way of Islam, upon the word of sincerity, upon the religion of our Prophet Muhammad ﷺ, and upon the way of our father Ibrāhīm, who was upright and a Muslim, and was not of those who associate others with Allah."]
  },
  {
    n: 10, when: "morning", source: "Nasā’ī", repeat: 3,
    ar: ["أَصْبَحْتُ أُثْنِيْ عَلَيْكَ حَمْدًا، وَأَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللهُ."],
    en: ["I have entered the morning praising You, and I bear witness that there is no god but Allah."]
  },
  {
    n: 10, when: "evening", source: "Nasā’ī", repeat: 3,
    ar: ["أَمْسَيْتُ أُثْنِيْ عَلَيْكَ حَمْدًا، وَأَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا اللهُ."],
    en: ["I have entered the evening praising You, and I bear witness that there is no god but Allah."]
  },
  {

/* ---------- App ---------- */
const LISTS = {
  morning: { ar: "أذكار الصباح", en: "Morning adhkār", items: DHIKR.filter(d => d.when !== "evening") },
  evening: { ar: "أذكار المساء", en: "Evening adhkār", items: DHIKR.filter(d => d.when !== "morning") }
};
const STORAGE_PREFIX = "adhkar:position:";

const track = document.getElementById("track");
const counter = document.getElementById("counter");
const progressBar = document.querySelector("#progress > div");
const progress = document.getElementById("progress");
const listToggle = document.getElementById("listToggle");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

let currentList = null;
let manualOverride = false;
let pages = [];
let currentIndex = 0;
let observer = null;

function listForNow() {
  return new Date().getHours() < 12 ? "morning" : "evening";
}

function savedIndex(list) {
  try {
    const value = parseInt(localStorage.getItem(STORAGE_PREFIX + list), 10);
    return Number.isFinite(value) ? value : 0;
  } catch (_) {
    return 0;
  }
}

function saveIndex(list, index) {
  try { localStorage.setItem(STORAGE_PREFIX + list, String(index)); } catch (_) { /* storage unavailable */ }
}

function repeatLabel(count) {
  return count > 1 ? `${count}×` : "";
}

function buildPage(dhikr, position, total, lang) {
  const page = document.createElement("section");
  page.className = `page ${lang === "ar" ? "arabic" : "english"}`;
  page.setAttribute("lang", lang);
  page.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

  const title = lang === "ar" ? dhikr.title_ar : dhikr.title_en;
  const paragraphs = (lang === "ar" ? dhikr.ar : dhikr.en).map(p => `<p>${p}</p>`).join("");
  const repeat = repeatLabel(dhikr.repeat);
  const positionLabel = lang === "ar" ? `الذكر ${position} من ${total}` : `Dhikr ${position} of ${total}`;

  page.innerHTML = `
    <article class="card">
      <div class="meta">
        <span>${positionLabel}</span>
        <span class="lang">${lang === "ar" ? "عربي" : "English"}</span>
      </div>
      <div class="body">
        <div class="text">
          ${title ? `<h2 class="title">${title}</h2>` : ""}
          ${paragraphs}
        </div>
      </div>
      <div class="foot">
        <span>${dhikr.source}</span>
        ${repeat ? `<span class="repeat">${repeat}</span>` : ""}
      </div>
    </article>`;
  return page;
}

function render(list) {
  currentList = list;
  const { ar, en, items } = LISTS[list];
  listToggle.querySelector(".ar").textContent = ar;
  listToggle.querySelector(".en").textContent = en;

  if (observer) { observer.disconnect(); }
  track.innerHTML = "";
  pages = [];
  items.forEach((dhikr, i) => {
    pages.push(buildPage(dhikr, i + 1, items.length, "ar"));
    pages.push(buildPage(dhikr, i + 1, items.length, "en"));
  });
  pages.forEach(p => track.appendChild(p));

  currentIndex = Math.min(savedIndex(list), pages.length - 1);
  goTo(currentIndex, "instant");
  updateUi();

  observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        currentIndex = pages.indexOf(entry.target);
        saveIndex(currentList, currentIndex);
        updateUi();
      }
    });
  }, { root: track, threshold: 0.6 });
  pages.forEach(p => observer.observe(p));
}

function goTo(index, behavior = "smooth") {
  index = Math.max(0, Math.min(index, pages.length - 1));
  pages[index].scrollIntoView({ behavior, inline: "start", block: "nearest" });
}

function updateUi() {
  counter.textContent = `${currentIndex + 1} / ${pages.length}`;
  const percent = ((currentIndex + 1) / pages.length) * 100;
  progressBar.style.width = `${percent}%`;
  progress.setAttribute("aria-valuenow", String(Math.round(percent)));
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === pages.length - 1;
}

nextBtn.addEventListener("click", () => goTo(currentIndex + 1));
prevBtn.addEventListener("click", () => goTo(currentIndex - 1));

document.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") { goTo(currentIndex + 1); }
  if (event.key === "ArrowRight") { goTo(currentIndex - 1); }
});

listToggle.addEventListener("click", () => {
  manualOverride = true;
  render(currentList === "morning" ? "evening" : "morning");
});

/* Keep the snapped page aligned after rotation or window resize. */
window.addEventListener("resize", () => goTo(currentIndex, "instant"));

/* If the app is reopened past midday (or before), follow the time of day unless the user chose a list. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !manualOverride && listForNow() !== currentList) {
    render(listForNow());
  }
});

render(listForNow());
</script>
