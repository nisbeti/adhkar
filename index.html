<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f1e7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الأذكار">
<title>الأذكار</title>
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="icon.svg?v=1" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "IndoPak Nastaleeq";
    src: url("https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2") format("woff2"),
         url("https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff") format("woff");
    font-display: swap;
  }
  :root {
    --bg: #f6f1e7;
    --card: #fffdf8;
    --ink: #2a251d;
    --muted: #7d7462;
    --accent: #b5542a;
    --line: #e4dccb;
    --shadow: 0 10px 30px rgba(60, 40, 10, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a16;
      --card: #26231e;
      --ink: #efe7d6;
      --muted: #a89e88;
      --accent: #e08a5c;
      --line: #3a352c;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a16;
    --card: #26231e;
    --ink: #efe7d6;
    --muted: #a89e88;
    --accent: #e08a5c;
    --line: #3a352c;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  header {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: .5rem;
    padding: calc(.75rem + env(safe-area-inset-top)) 1rem .5rem;
  }
  #listToggle {
    background: none;
    border: 0;
    color: var(--ink);
    font: inherit;
    text-align: start;
    padding: 0;
    cursor: pointer;
    line-height: 1.3;
    justify-self: start;
    min-width: 0;
  }
  #listToggle:disabled { cursor: default; }
  #listToggle .ar { font-size: 1.3rem; font-weight: 700; display: block; white-space: nowrap; }
  #listToggle .en { font-size: .75rem; color: var(--muted); display: block; letter-spacing: .04em; white-space: nowrap; }
  #sectionMenu {
    display: flex;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 999px;
    padding: 2px;
  }
  #sectionMenu button {
    background: none;
    border: 0;
    border-radius: 999px;
    color: var(--muted);
    font: inherit;
    font-size: 1rem;
    line-height: 1.4;
    padding: .2rem .7rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #sectionMenu button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .header-end {
    display: flex;
    align-items: center;
    gap: .5rem;
    justify-self: end;
  }
  #counter {
    font-size: .95rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #themeToggle {
    width: 2.1rem;
    height: 2.1rem;
    flex: 0 0 auto;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #themeToggle:hover { color: var(--accent); border-color: var(--accent); }

  #track {
    flex: 1 1 auto;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }
  #track::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow-y: auto;
    padding: .5rem 1.25rem 1.25rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    box-shadow: var(--shadow);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1.5rem 1.25rem;
  }
  .card .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    color: var(--muted);
    font-size: .95rem;
    padding-bottom: .75rem;
    border-bottom: 1px solid var(--line);
  }
  .card .meta .lang { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
  .card .body {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding: 1.25rem 0;
  }
  .card .text { width: 100%; margin: 0; }
  .card .title { color: var(--accent); margin: 0 0 .75rem; font-size: 1.15rem; font-weight: 700; }
  .page.arabic .text {
    font-size: clamp(1.7rem, 4.8vw, 2.4rem);
    line-height: 2.1;
    text-align: right;
  }
  .page.english .text {
    font-size: clamp(1.2rem, 3.2vw, 1.55rem);
    line-height: 1.65;
    text-align: left;
    font-style: italic;
  }
  .page.english .card { direction: ltr; }
  .page.quran.arabic .text {
    font-family: "Amiri Quran", "Amiri", serif;
    font-size: clamp(1.55rem, 4.4vw, 2.2rem);
    line-height: 2.3;
    text-align: justify;
    text-align-last: right;
  }
  .page.quran.english .text { font-style: normal; font-size: clamp(1.1rem, 3vw, 1.4rem); }
  .page.quran .basmalah { text-align: center; color: var(--accent); margin: 0 0 1rem; font-weight: 400; font-size: 1.1em; }
  .page.quran.english .basmalah { font-style: italic; font-size: 1em; }
  .ayah-end { color: var(--accent); white-space: nowrap; }
  .verse-num {
    color: var(--accent);
    font-weight: 700;
    font-size: .8em;
    margin-inline-end: .35em;
    font-variant-numeric: tabular-nums;
  }
  .credit { color: var(--muted); font-size: .85rem; line-height: 1.5; }
  .credit a { color: inherit; }

  /* Arabic font choice: Amiri (default) or IndoPak Nastaleeq. */
  .when-indopak { display: none; }
  :root[data-font="indopak"] .when-amiri { display: none; }
  :root[data-font="indopak"] .when-indopak { display: revert; }
  :root[data-font="indopak"] .page.arabic .text {
    font-family: "IndoPak Nastaleeq", "Amiri", serif;
    font-size: clamp(1.85rem, 5.2vw, 2.6rem);
    line-height: 2.4;
  }
  :root[data-font="indopak"] .page.quran.arabic .text {
    font-family: "IndoPak Nastaleeq", "Amiri Quran", serif;
    font-size: clamp(1.7rem, 4.8vw, 2.4rem);
  }

  .font-toggle {
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    font: inherit;
    font-size: .8rem;
    letter-spacing: .04em;
    line-height: 1.4;
    padding: .1rem .65rem;
    cursor: pointer;
    direction: ltr;
  }
  .font-toggle:hover { color: var(--accent); border-color: var(--accent); }
  .card .text p { margin: 0 0 1em; }
  .card .text p:last-child { margin-bottom: 0; }
  .card .foot {
    display: flex;
    justify-content: flex-end;
    gap: 1rem;
    padding-top: .75rem;
    border-top: 1px solid var(--line);
    font-size: 1rem;
  }
  .repeat {
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: .1rem .75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  footer {
    flex: 0 0 auto;
    padding: 0 1.25rem calc(.75rem + env(safe-area-inset-bottom));
  }
  #progress {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width .25s ease;
  }

  .nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow);
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .9;
  }
  .nav:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
  .nav:disabled { opacity: .25; cursor: default; }
  #nextBtn { left: .5rem; }
  #prevBtn { right: .5rem; }
  @media (pointer: coarse) { .nav { display: none; } }
</style>
</head>
<body>

<header>
  <button id="listToggle" type="button" aria-live="polite">
    <span class="ar"></span>
    <span class="en"></span>
  </button>
  <nav id="sectionMenu" aria-label="Section">
    <button type="button" data-section="adhkar" aria-pressed="false" aria-label="Adhkār">الأذكار</button>
    <button type="button" data-section="kahf" aria-pressed="false" aria-label="Sūrat al-Kahf">الكهف</button>
  </nav>
  <div class="header-end">
    <div id="counter" aria-live="polite"></div>
    <button id="themeToggle" type="button" aria-label="Switch to dark mode"></button>
  </div>
</header>

<main id="track" aria-label="Pages"></main>

<footer>
  <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div></div></div>
</footer>

<button class="nav" id="prevBtn" type="button" aria-label="Previous page">&#x276F;</button>
<button class="nav" id="nextBtn" type="button" aria-label="Next page">&#x276E;</button>

<script src="kahf.js"></script>
<script>
/* ---------- Data: pages 4–7 of the Morning & Evening Adhkār leaflet ---------- */
/* when: "both" | "morning" | "evening".  A dhikr numbered 8–14 has a morning and an evening wording. */
const DHIKR = [
  {
    n: 1, when: "both", source: "Tabarānī", repeat: 1,
    title_ar: "آية الكرسي", title_en: "Āyat al-Kursī (2:255)",
    ar: ["اللهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَؤُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ."],
    en: ["Allah, there is no god but He, the Ever Living, the One Who sustains and protects all that exists. Neither drowsiness overtakes Him nor sleep. To Him Alone belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except with His permission? He knows what is before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursī extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great."]
  },
  {
    n: 2, when: "both", source: "Tirmidhī", repeat: 3,
    title_ar: "سورة الإخلاص", title_en: "Sūrah al-Ikhlāṣ (112)",
    ar: ["قُلْ هُوَ اللهُ أَحَدٌ ۝ اللهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ۝"],
    en: ["Say, He is Allah, the One, the Self-Sufficient Master, Who has not given birth and was not born, and to Whom no one is equal."]
  },
  {
    n: 2, when: "both", source: "Tirmidhī", repeat: 3,
    title_ar: "سورة الفلق", title_en: "Sūrah al-Falaq (113)",
    ar: ["قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝"],
    en: ["Say, I seek protection of the Lord of the daybreak, from the evil of what He has created, and from the evil of the darkening night when it settles, and from the evil of the blowers in knots, and from the evil of the envier when he envies."]
  },
  {
    n: 2, when: "both", source: "Tirmidhī", repeat: 3,
    title_ar: "سورة الناس", title_en: "Sūrah al-Nās (114)",
    ar: ["قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ ۝"],
    en: ["Say, I seek protection of the Lord of mankind, the King of mankind, the God of mankind, from the evil of the whisperer who withdraws, who whispers in the hearts of mankind, whether they be Jinn or people."]
  },
  {
    n: 3, when: "both", source: "Bukhārī", repeat: 1,
    title_ar: "سيد الاستغفار", title_en: "The master supplication for forgiveness",
    ar: ["اللَّهُمَّ أَنْتَ رَبِّيْ لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِيْ وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوْذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوْءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوْءُ بِذَنْبِيْ، فَاغْفِرْ لِيْ، فَإِنَّهُ لَا يَغْفِرُ الذُّنُوْبَ إِلَّا أَنْتَ."],
    en: ["O Allah, You are my Lord. There is no god except You. You have created me, and I am Your slave, and I am under Your covenant and pledge (to fulfil it) to the best of my ability. I seek Your protection from the evil that I have done. I acknowledge the favours that You have bestowed upon me, and I admit my sins. Forgive me, for none forgives sins but You."]
  },
  {
    n: 4, when: "both", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ إِنِّيْ أَعُوْذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوْذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوْذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوْذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ."],
    en: ["O Allah, I seek Your protection from anxiety and grief. I seek Your protection from inability and laziness. I seek Your protection from cowardice and miserliness and I seek Your protection from being overcome by debt and being overpowered by men."]
  },
  {
    n: 5, when: "both", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ إِنِّيْ أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّيْ أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِيْ دِيْنِيْ وَدُنْيَايَ وَأَهْلِيْ وَمَالِيْ، اللَّهُمَّ اسْتُرْ عَوْرَاتِيْ وَآمِنْ رَوْعَاتِيْ، اللَّهُمَّ احْفَظْنِيْ مِنْ بَيْنِ يَدَيَّ، وَمِنْ خَلْفِيْ، وَعَنْ يَمِيْنِيْ، وَعَنْ شِمَالِيْ، وَمِنْ فَوْقِيْ، وَأَعُوْذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِيْ."],
    en: ["O Allah, I ask You for well-being in this world and the next. O Allah, I ask You for forgiveness and well-being in my religion, in my worldly affairs, in my family and in my wealth. O Allah, conceal my faults and calm my fears. O Allah, guard me from in front of me and behind me, from my right, and from my left, and from above me. I seek protection in Your Greatness from being unexpectedly destroyed from beneath me."]
  },
  {
    n: 6, when: "both", source: "Tirmidhī", repeat: 1,
    ar: ["اللَّهُمَّ عَالِمَ الْغَيْبِ وَالشَّهَادَةِ، فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ، رَبَّ كُلِّ شَيْءٍ وَمَلِيْكَهُ، أَشْهَدُ أَنْ لَا إِلَٰهَ إِلَّا أَنْتَ، أَعُوْذُ بِكَ مِنْ شَرِّ نَفْسِيْ، وَمِنْ شَرِّ الشَّيْطَانِ وَشِرْكِهِ، وَأَنْ أَقْتَرِفَ عَلَىٰ نَفْسِيْ سُوْءًا، أَوْ أَجُرَّهُ إِلَىٰ مُسْلِمٍ."],
    en: ["O Allah, Knower of the unseen and the seen, Creator of the heavens and the earth, the Lord and Sovereign of everything; I bear witness that there is no god but You. I seek Your protection from the evil of my own self, from the evil of Shaytān and from the evil of polytheism to which he calls, and from inflicting evil on myself, or bringing it upon a Muslim."]
  },
  {
    n: 7, when: "both", source: "Nasā’ī", repeat: 1,
    ar: ["يَا حَيُّ يَا قَيُّوْمُ، بِرَحْمَتِكَ أَسْتَغِيْثُ، أَصْلِحْ لِيْ شَأْنِيْ كُلَّهُ، وَلَا تَكِلْنِيْ إِلَىٰ نَفْسِيْ طَرْفَةَ عَيْنٍ."],
    en: ["O the Ever Living, the One Who sustains and protects all that exists; I seek assistance through Your mercy. Rectify all of my affairs and do not entrust me to myself for the blink of an eye."]
  },

  {
    n: 8, when: "morning", source: "Abū Dāwūd", repeat: 1,
    ar: ["اللَّهُمَّ مَا أَصْبَحَ بِيْ مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيْكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ."],
    en: ["O Allah, all the favours that I or anyone from Your creation has received in the morning, are from You Alone. You have no partner. To You Alone belong all praise and all thanks."]
  },
  {
    n: 8, when: "evening", source: "Abū Dāwūd", repeat: 1,

function listForNow() {
  return new Date().getHours() < 12 ? "morning" : "evening";
}

function readStorage(key) {
  try { return localStorage.getItem(key); } catch (_) { return null; }
}

function writeStorage(key, value) {
  try { localStorage.setItem(key, value); } catch (_) { /* storage unavailable */ }
}

function savedIndex(list) {
  const value = parseInt(readStorage(STORAGE_PREFIX + list), 10);
  return Number.isFinite(value) ? value : 0;
}

function saveIndex(list, index) {
  writeStorage(STORAGE_PREFIX + list, String(index));
}

function savedSection() {
  return readStorage(SECTION_KEY) === "kahf" ? "kahf" : "adhkar";
}

function repeatLabel(count) {
  return count > 1 ? `${count}×` : "";
}

function toArabicDigits(number) {
  return String(number).replace(/\d/g, digit => "٠١٢٣٤٥٦٧٨٩"[digit]);
}

function createPage(lang, extraClass = "") {
  const page = document.createElement("section");
  page.className = `page ${lang === "ar" ? "arabic" : "english"} ${extraClass}`.trim();
  page.setAttribute("lang", lang);
  page.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  return page;
}

function cardHtml(positionLabel, lang, body, foot = "") {
  const corner = lang === "ar"
    ? `<button type="button" class="font-toggle" aria-label="Switch Arabic font"><span class="when-amiri">Amiri</span><span class="when-indopak">IndoPak</span></button>`
    : `<span class="lang">English</span>`;
  return `
    <article class="card">
      <div class="meta">
        <span>${positionLabel}</span>
        ${corner}
      </div>
      <div class="body">
        <div class="text">${body}</div>
      </div>
      ${foot ? `<div class="foot">${foot}</div>` : ""}
    </article>`;
}

function buildDhikrPage(dhikr, position, total, lang) {
  const page = createPage(lang);
  const title = lang === "ar" ? dhikr.title_ar : dhikr.title_en;
  const paragraphs = (lang === "ar" ? dhikr.ar : dhikr.en).map(p => `<p>${p}</p>`).join("");
  const repeat = repeatLabel(dhikr.repeat);
  const positionLabel = lang === "ar" ? `الذكر ${position} من ${total}` : `Dhikr ${position} of ${total}`;
  page.innerHTML = cardHtml(
    positionLabel,
    lang,
    `${title ? `<h2 class="title">${title}</h2>` : ""}${paragraphs}`,
    repeat ? `<span class="repeat">${repeat}</span>` : ""
  );
  return page;
}

function buildVersePage(verses, position, total, lang) {
  const page = createPage(lang, "quran");
  const first = verses[0].n;
  const last = verses[verses.length - 1].n;
  const positionLabel = lang === "ar" ? `الآيات ${first}–${last}` : `Verses ${first}–${last}`;
  const isOpening = first === 1;

  let body;
  if (lang === "ar") {
    const uthmani = verses
      .map(verse => `${verse.ar} <span class="ayah-end">&#x06DD;${toArabicDigits(verse.n)}</span>`)
      .join(" ");
    /* The IndoPak text carries its own numbered verse icons, drawn by the IndoPak font. */
    const indopak = verses.map(verse => verse.ar_indopak).join(" ");
    body = `
      <div class="when-amiri">${isOpening ? `<h2 class="basmalah">${KAHF.basmalah_ar}</h2>` : ""}<p>${uthmani}</p></div>
      <div class="when-indopak">${isOpening ? `<h2 class="basmalah">${KAHF.basmalah_ar_indopak}</h2>` : ""}<p>${indopak}</p></div>`;
  } else {
    const text = verses.map(verse => `<p><span class="verse-num">${verse.n}</span>${verse.en}</p>`).join("");
    body = `${isOpening ? `<h2 class="basmalah">${KAHF.basmalah_en}</h2>` : ""}${text}`;
  }

  const indopakCredit = 'IndoPak text and font: Ayman Siddiqui and R. Siddiqua, <a href="https://quranwbw.com" target="_blank" rel="noopener">QuranWBW.com</a> and <a href="https://quran.com" target="_blank" rel="noopener">Quran.com</a>.';
  const credit = isOpening
    ? `<span class="credit">${lang === "ar"
        ? `<span class="when-amiri">النص: مشروع <a href="https://tanzil.net" target="_blank" rel="noopener">تنزيل</a></span><span class="when-indopak" dir="ltr">${indopakCredit}</span>`
        : `<span class="when-amiri">Arabic text: <a href="https://tanzil.net" target="_blank" rel="noopener">Tanzil Project</a>.</span><span class="when-indopak">${indopakCredit}</span> Translation: M. M. Pickthall, 1930.`}</span>`
    : "";
  page.innerHTML = cardHtml(positionLabel, lang, body, credit);
  return page;
}

function render(list) {
  currentList = list;
  const { ar, en, items, build } = LISTS[list];
  listToggle.querySelector(".ar").textContent = ar;
  listToggle.querySelector(".en").textContent = en;

  if (observer) { observer.disconnect(); }
  track.innerHTML = "";
  pages = [];
  items.forEach((item, i) => {
    pages.push(build(item, i + 1, items.length, "ar"));
    pages.push(build(item, i + 1, items.length, "en"));
  });
  pages.forEach(p => track.appendChild(p));

  currentIndex = Math.min(savedIndex(list), pages.length - 1);
  goTo(currentIndex, "instant");
  updateUi();

  observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        currentIndex = pages.indexOf(entry.target);
        saveIndex(currentList, currentIndex);
        updateUi();
      }
    });
  }, { root: track, threshold: 0.6 });
  pages.forEach(p => observer.observe(p));
}

function showSection(section) {
  currentSection = section;
  writeStorage(SECTION_KEY, section);
  sectionButtons.forEach(button => {
    button.setAttribute("aria-pressed", String(button.dataset.section === section));
  });

  const isAdhkar = section === "adhkar";
  listToggle.disabled = !isAdhkar;
  listToggle.title = isAdhkar ? "Switch between morning and evening" : "";
  if (isAdhkar) {
    render(manualOverride ? currentAdhkarChoice : listForNow());
  } else {
    render("kahf");
  }
}

function goTo(index, behavior = "smooth") {
  index = Math.max(0, Math.min(index, pages.length - 1));
  pages[index].scrollIntoView({ behavior, inline: "start", block: "nearest" });
}

function updateUi() {
  counter.textContent = `${Math.floor(currentIndex / 2) + 1} / ${pages.length / 2}`;
  const percent = ((currentIndex + 1) / pages.length) * 100;
  progressBar.style.width = `${percent}%`;
  progress.setAttribute("aria-valuenow", String(Math.round(percent)));
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === pages.length - 1;
}

nextBtn.addEventListener("click", () => goTo(currentIndex + 1));
prevBtn.addEventListener("click", () => goTo(currentIndex - 1));

document.addEventListener("keydown", event => {
  if (event.key === "ArrowLeft") { goTo(currentIndex + 1); }
  if (event.key === "ArrowRight") { goTo(currentIndex - 1); }
});

listToggle.addEventListener("click", () => {
  if (currentSection !== "adhkar") { return; }
  manualOverride = true;
  currentAdhkarChoice = currentList === "morning" ? "evening" : "morning";
  render(currentAdhkarChoice);
});

sectionButtons.forEach(button => {
  button.addEventListener("click", () => {
    if (button.dataset.section !== currentSection) {
      showSection(button.dataset.section);
    }
  });
});

/* Keep the snapped page aligned after rotation or window resize. */
window.addEventListener("resize", () => goTo(currentIndex, "instant"));

/* In the adhkār section, follow the time of day on reopen unless the user chose a list. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && currentSection === "adhkar"
      && !manualOverride && listForNow() !== currentList) {
    render(listForNow());
  }
});

/* ---------- Theme ---------- */
function savedTheme() {
  try { return localStorage.getItem(THEME_KEY); } catch (_) { return null; }
}

function currentTheme() {
  const saved = savedTheme();
  if (saved === "light" || saved === "dark") { return saved; }
  return systemDark.matches ? "dark" : "light";
}

function applyTheme() {
  const saved = savedTheme();
  if (saved === "light" || saved === "dark") {
    document.documentElement.setAttribute("data-theme", saved);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  const dark = currentTheme() === "dark";
  themeToggle.textContent = dark ? "\u2600" : "\u263E";
  themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  themeColorMeta.setAttribute("content", dark ? "#1c1a16" : "#f6f1e7");
}

themeToggle.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  try { localStorage.setItem(THEME_KEY, next); } catch (_) { /* storage unavailable */ }
  applyTheme();
});

systemDark.addEventListener("change", applyTheme);

/* ---------- Arabic font ---------- */
function applyFont() {
  if (readStorage(FONT_KEY) === "indopak") {
    document.documentElement.setAttribute("data-font", "indopak");
  } else {
    document.documentElement.removeAttribute("data-font");
  }
}

track.addEventListener("click", event => {
  if (!event.target.closest(".font-toggle")) { return; }
  writeStorage(FONT_KEY, readStorage(FONT_KEY) === "indopak" ? "amiri" : "indopak");
  applyFont();
});

/* ---------- Updates ---------- */
/* Home-screen apps on iOS often resume an old copy of the page, so check for a newer deploy on resume. */
let loadedPageVersion = null;

async function livePageVersion() {
  try {
    const response = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
    return response.ok ? (response.headers.get("etag") || response.headers.get("last-modified")) : null;
  } catch (_) {
    return null;
  }
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || !loadedPageVersion) { return; }
  const liveVersion = await livePageVersion();
  if (liveVersion && liveVersion !== loadedPageVersion) {
    location.reload();
  }
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => { /* offline support is optional */ });
}

applyTheme();
applyFont();
showSection(savedSection());
livePageVersion().then(version => { loadedPageVersion = version; });
</script>
</body>
</html>
